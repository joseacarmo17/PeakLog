spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/peaklog
    username: postgres
    password: ${database_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

server:
  port: 8080