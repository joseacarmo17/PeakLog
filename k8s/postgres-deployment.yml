apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: peaklog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: peaklog
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: peaklog-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peaklog-secret
                  key: SPRING_DATASOURCE_PASSWORD